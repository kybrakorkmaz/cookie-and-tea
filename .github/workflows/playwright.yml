name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Keep your valid checkout commit pin intact
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # The E2E suite needs a live API on :8001 — the backend repo is public,
      # so it can be checked out without extra credentials.
      - name: Check out backend repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kybrakorkmaz/cookie-and-tea-backend
          path: backend
          persist-credentials: false

      # Updated to official v4 release tag
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # .env.test files are gitignored, so CI generates them with self-contained
      # dummy values. Cloudinary/iyzico stay mocked/stubbed and SMTP failures are
      # swallowed by the sign-up flow, so no real external credentials are needed.
      - name: Create backend test environment
        working-directory: backend
        run: |
          cat > .env.test << 'EOF'
          NODE_ENV=test
          PORT=8001
          BASE_URL=http://localhost:8001
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/cat_test
          JWT_SECRET=ci_e2e_jwt_secret
          EMAIL_HOST=localhost
          EMAIL_PORT=2525
          EMAIL_USERNAME=ci_dummy
          EMAIL_PASSWORD=ci_dummy
          FROM_NAME=Cookie & Tea CI
          FROM_EMAIL=noreply@cookieandtea.com
          BYPASS_SECRET=ci_e2e_bypass_secret
          FRONTEND_ORIGIN=http://localhost:5173
          CLOUDINARY_CLOUD_NAME=ci_dummy
          CLOUDINARY_API_KEY=ci_dummy
          CLOUDINARY_API_SECRET=ci_dummy
          CLOUDINARY_URL=cloudinary://ci:ci@ci_dummy
          MOCK_IYZICO=true
          IYZICO_API_KEY=ci_dummy
          IYZICO_SECRET_KEY=ci_dummy
          IYZICO_BASE_URL=https://sandbox-api.iyzipay.com
          EOF

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Migrate test database
        working-directory: backend
        run: npm run db:migrate:test

      - name: Start backend API
        working-directory: backend
        run: nohup node --env-file=.env.test src/servers/index.js &

      - name: Create frontend test environment
        run: |
          cat > .env.test << 'EOF'
          VITE_API_BASE_URL=http://localhost:8001
          VITE_EMAILJS_SERVICE_ID=ci_dummy
          VITE_EMAILJS_PUBLIC_KEY=ci_dummy
          VITE_EMAILJS_TEMPLATE_ID=ci_dummy
          PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_ci_dummy
          BYPASS_SECRET=ci_e2e_bypass_secret
          EOF

      - name: Wait for backend API
        run: npx --yes wait-on http://localhost:8001/health

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps firefox

      - name: Run Playwright tests
        run: npx playwright test

      # Updated to official v4 release tag
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
