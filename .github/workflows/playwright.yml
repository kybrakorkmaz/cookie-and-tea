name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # Pin to v4.2.2 tag commit SHA and explicitly remove token persistence
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Pin to v4.2.0 tag commit SHA
      - uses: actions/setup-node@39225d467ee2295d8853236206e0b06fe26e87f8
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      # Pin to v4.6.0 tag commit SHA
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45b530
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30